name: Bug report
description: Report a reproducible problem in a Lab mechanism or experiment.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: experiment
    attributes:
      label: Experiment or component
      description: Identify the experiment ID, path, and revision.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest content-safe reproduction.
    validations:
      required: true
  - type: checkboxes
    id: content
    attributes:
      label: Public-content confirmation
      options:
        - label: I removed private context, proprietary lore, unpublished canon, credentials, and personal data.
          required: true
